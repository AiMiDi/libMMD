name: saba-build-actions
on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Release, Debug]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libbullet-dev libgl1-mesa-dev libglu1-mesa-dev

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake bullet

    - name: Cache Bullet3 (Windows)
      if: matrix.os == 'windows-latest'
      id: cache-bullet3
      uses: actions/cache@v4
      with:
        path: bullet3/install
        key: bullet3-${{ runner.os }}-${{ matrix.build_type }}-${{ hashFiles('**/bullet3-version') }}
        restore-keys: |
          bullet3-${{ runner.os }}-${{ matrix.build_type }}-

    - name: Install dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install cmake
        if (-Not (Test-Path "bullet3/install")) {
          # Download and build Bullet Physics only if not cached
          git clone https://github.com/bulletphysics/bullet3.git
          cd bullet3
          # Create a version file for cache key
          git rev-parse HEAD | Out-File -FilePath "../bullet3-version" -Encoding ASCII
          mkdir build
          cd build
          cmake .. `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DBUILD_SHARED_LIBS=OFF `
            -DUSE_MSVC_RUNTIME_LIBRARY_DLL=ON `
            -DBUILD_CPU_DEMOS=Off `
            -DBUILD_OPENGL3_DEMOS=Off `
            -DBUILD_BULLET2_DEMOS=Off `
            -DBUILD_UNIT_TESTS=Off `
            -DBUILD_BULLET3=Off `
            -DBUILD_EXTRAS=Off `
            -DUSE_GRAPHICAL_BENCHMARK=Off `
            -DBUILD_PYBULLET=Off `
            -DCMAKE_INSTALL_PREFIX=../install `
            -DINSTALL_LIBS=ON
          cmake --build . --config ${{ matrix.build_type }}
          cmake --install . --prefix ../install --config ${{ matrix.build_type }}
        } else {
          Write-Host "Using cached Bullet3 installation"
        }
      shell: powershell

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DSABA_BULLET_ROOT="/usr" \
            -DSABA_ENABLE_TEST=ON \
            -DSABA_BUILD_MMD2OBJ=ON
        elif [ "${{ matrix.os }}" = "windows-latest" ]; then
          BULLET_ROOT="$(pwd)/../bullet3/install"
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            cmake .. \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DSABA_BULLET_ROOT="$BULLET_ROOT" \
              -DBULLET_INCLUDE_DIR="$BULLET_ROOT/include/bullet" \
              -DBULLET_DYNAMICS_LIBRARY="$BULLET_ROOT/lib/BulletDynamics_Debug.lib" \
              -DBULLET_COLLISION_LIBRARY="$BULLET_ROOT/lib/BulletCollision_Debug.lib" \
              -DBULLET_MATH_LIBRARY="$BULLET_ROOT/lib/LinearMath_Debug.lib" \
              -DBULLET_SOFTBODY_LIBRARY="$BULLET_ROOT/lib/BulletSoftBody_Debug.lib" \
              -DSABA_ENABLE_TEST=ON \
              -DSABA_BUILD_MMD2OBJ=ON
          else
            cmake .. \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DSABA_BULLET_ROOT="$BULLET_ROOT" \
              -DBULLET_INCLUDE_DIR="$BULLET_ROOT/include/bullet" \
              -DBULLET_DYNAMICS_LIBRARY="$BULLET_ROOT/lib/BulletDynamics.lib" \
              -DBULLET_COLLISION_LIBRARY="$BULLET_ROOT/lib/BulletCollision.lib" \
              -DBULLET_MATH_LIBRARY="$BULLET_ROOT/lib/LinearMath.lib" \
              -DBULLET_SOFTBODY_LIBRARY="$BULLET_ROOT/lib/BulletSoftBody.lib" \
              -DSABA_ENABLE_TEST=ON \
              -DSABA_BUILD_MMD2OBJ=ON
          fi
        else 
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DSABA_BULLET_ROOT="$(brew --prefix bullet)" \
            -DSABA_ENABLE_TEST=ON \
            -DSABA_BUILD_MMD2OBJ=ON
        fi
      shell: bash

    - name: Build
      run: |
        cd build
        cmake --build . --config ${{ matrix.build_type }} -j

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure -C ${{ matrix.build_type }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: saba-${{ matrix.os }}-${{ matrix.build_type }}
        path: |
          build/src/
          build/mmd2obj*
        retention-days: 7
